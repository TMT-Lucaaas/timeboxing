# Include inside the existing HTTPS server block.
# Upload out/ contents into /srv/timeboxing/current/timeboxing/.
location = /timeboxing {
    return 308 /timeboxing/;
}

location ^~ /timeboxing/ {
    root /srv/timeboxing/current;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
}
